services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twello
      POSTGRES_DB: twello
      POSTGRES_PASSWORD: ${TWELLO_DEV_DB_PASSWORD:?Set TWELLO_DEV_DB_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - twello_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twello -d twello"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  twello_dev_db:
